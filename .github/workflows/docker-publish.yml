name: Publish Docker images

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  PUBLIC_URL: ''
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/handy-notion-api
  WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/handy-notion-web

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: note_test
          POSTGRES_PASSWORD: note_test
          POSTGRES_DB: note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U note_test -d note_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTE_TEST_DATABASE_URL: postgres://note_test:note_test@localhost:5432/note_test?sslmode=disable
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test deployment decisions
        working-directory: .
        run: |
          bash -n deploy/auto-update.sh
          python3 deploy/test_auto_update.py
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  publish:
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ env.PUBLIC_URL }}
            VITE_AUTH_URL=${{ env.PUBLIC_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
